[project]
name = "verified_code_review"
version = "0.1.0"
description = "A CrewAI crew that reviews code changes and attests the completed work on-chain via MINT Protocol."
authors = [{ name = "FoundryNet", email = "hello@foundrynet.io" }]
requires-python = ">=3.10,<3.13"
dependencies = [
    "crewai[tools]>=0.108.0",
    "mint-attest>=0.3.0",
]

[project.scripts]
verified_code_review = "verified_code_review.main:run"
run_crew = "verified_code_review.main:run"
train = "verified_code_review.main:train"
replay = "verified_code_review.main:replay"
test = "verified_code_review.main:test"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.crewai]
type = "crew"
